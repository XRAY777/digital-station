server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 30s;
    }
    location = /health { proxy_pass http://backend:8000/health; proxy_set_header Host $host; }
    location = /health/live { proxy_pass http://backend:8000/health/live; proxy_set_header Host $host; }
    location = /docs { proxy_pass http://backend:8000/docs; proxy_set_header Host $host; }
    location = /openapi.json { proxy_pass http://backend:8000/openapi.json; proxy_set_header Host $host; }
    location /static/docs/ { proxy_pass http://backend:8000/static/docs/; proxy_set_header Host $host; }
    location /ws/ {
        proxy_pass http://backend:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }
    location / { try_files $uri $uri/ /index.html; }
}
